name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 is the documented floor, 24 is the current LTS.
        node: ['20', '24']

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Typecheck portal
        run: npm run typecheck -w @constructops/portal

      - name: Build portal
        run: npm run build -w @constructops/portal

      - name: Smoke
        run: npm run smoke

  integration:
    name: integration (postgres 16 + redis 7)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: constructops
          POSTGRES_PASSWORD: constructops
          POSTGRES_DB: constructops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U constructops -d constructops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      NODE_ENV: production
      PORT: '8080'
      DATABASE_URL: postgresql://constructops:constructops@localhost:5432/constructops
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-hmac-secret-with-more-than-32-characters-long
      PLATFORM_ROOT_DOMAIN: constructops.test
      TRUST_PROXY: 'false'
      RATE_LIMIT_MAX: '10000'
      AUTH_RATE_LIMIT_MAX: '10000'
      BCRYPT_ROUNDS: '4'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install
        # NODE_ENV=production is set for the runtime; the migration/seed/smoke
        # tooling is TypeScript and needs devDependencies present in this job.
        run: npm ci --no-audit --no-fund --include=dev

      - name: Migrate
        run: npm run migrate

      - name: Re-run migrations (idempotency)
        run: npm run migrate

      - name: Seed
        run: npm run seed

      - name: Re-run seed (idempotency)
        run: npm run seed

      - name: Build API
        run: npm run build

      - name: Start API
        run: |
          node dist/server.js > api.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8080/healthz > /dev/null; then
              echo "API is ready"
              exit 0
            fi
            sleep 1
          done
          echo "API failed to start"
          cat api.log
          exit 1

      - name: Live smoke (real PostgreSQL + Redis)
        run: npm run smoke:live

      - name: API logs on failure
        if: failure()
        run: cat api.log || true

  e2e:
    name: portal e2e (chromium)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:e2e

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7
