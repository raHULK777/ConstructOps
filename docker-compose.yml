services:
  postgres:
    image: postgres:16-alpine
    container_name: constructops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: constructops
      POSTGRES_PASSWORD: constructops
      POSTGRES_DB: constructops
    ports:
      - '5432:5432'
    volumes:
      - constructops_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U constructops -d constructops']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: constructops-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - constructops_redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  constructops_pgdata:
  constructops_redisdata:
